[package]
name        = "flair-rs"
version     = "0.2.1"
edition     = "2024"
rust-version = "1.85"
description = "Wasm-compilable implement of time series forecasting algorithm FLAIR."
license     = "Apache-2.0"
repository  = "https://github.com/animagram-jp/flair"
keywords    = ["forecasting", "time-series", "wasm", "no-std", "statistics"]
categories  = ["science", "no-std", "wasm"]
exclude     = ["examples/dataset/"]

[features]
default = []
std = []

[dependencies]
libm = "0.2"

[dev-dependencies]
nalgebra = "0.35"

[lib]
name = "flair"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_op_in_unsafe_fn = "forbid"
unused_must_use        = "deny"

[lints.clippy]
all                             = { level = "deny", priority = -1 }
undocumented_unsafe_blocks      = "forbid"
unnecessary_safety_comment      = "deny"
unnecessary_safety_doc          = "deny"
missing_safety_doc              = "deny"
allow_attributes                = "deny"
allow_attributes_without_reason = "deny"
too_many_arguments              = "allow"
type_complexity                 = "allow"
excessive_precision             = "allow"
new_without_default             = "allow"
std_instead_of_core             = "deny"
std_instead_of_alloc            = "deny"
alloc_instead_of_core           = "deny"

name: "CI"

on:
    push:
        branches: ["main"]
        tags: ["*.*.*"]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: "ci-${{ github.ref }}"
    cancel-in-progress: true

jobs:
    changes:
        if: github.ref_type != 'tag'
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.diff.outputs.code }}
        steps:
            - name: "git checkout"
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: "detect code changes"
              id: "diff"
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
                  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
              run: |
                  if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
                      echo "code=true" >> "$GITHUB_OUTPUT"
                  elif git diff --name-only "$BASE...$HEAD" | grep -q -v -E '(\.md|^LICENSE|^NOTICE)$'; then
                      echo "code=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "code=false" >> "$GITHUB_OUTPUT"
                  fi

    validate:
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: "git checkout"
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: "install nightly rustfmt and clippy"
              run: rustup toolchain install nightly --profile minimal --component rustfmt,clippy

            - name: "cargo fmt"
              run: cargo +nightly fmt --check

            - name: "cargo clippy"
              run: cargo +nightly clippy --all-features --all-targets

            - name: "cargo doc"
              run: cargo doc --all-features --no-deps
              env:
                  RUSTDOCFLAGS: "-D warnings"

    test:
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: "git checkout"
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: "install llvm-tools"
              run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview

            - name: "install cargo-llvm-cov"
              uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
              with:
                  tool: "cargo-llvm-cov"

            - name: "cargo test"
              run: |
                  cargo test --doc --all-features
                  cargo +nightly llvm-cov --branch --lib --tests --all-features --lcov --output-path lcov.info

            - name: "cargo run (integration_tests)"
              run: cargo run --example integration_tests

            - name: "upload coverage"
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  files: "lcov.info"
                  use_oidc: true
                  fail_ci_if_error: true

    signoff:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: "git checkout"
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: "verify sign-off of every commit"
              env:
                  BASE: ${{ github.event.pull_request.base.sha }}
                  HEAD: ${{ github.event.pull_request.head.sha }}
                  OPENER: ${{ github.event.pull_request.user.login }}
              run: |
                  status=0
                  for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
                      email="$(git show -s --format=%ae "$commit")"
                      if [ "$OPENER" = "dependabot[bot]" ] && [ "$email" = "49699333+dependabot[bot]@users.noreply.github.com" ]; then
                          continue
                      fi
                      if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$commit" | grep -q -i -F "<$email>"; then
                          echo "::error::commit $commit has no Signed-off-by trailer of its author <$email>"
                          status=1
                      fi
                  done
                  exit "$status"

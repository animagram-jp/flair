name: "CodeQL"

on:
    push:
        branches: ["main"]
        tags: ["*.*.*"]
    pull_request:
        branches: ["main"]
    schedule:
        - cron: "17 3 * * 1"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    analyze:
        name: "Analyze (${{ matrix.language }})"
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                language: ${{ fromJSON(github.ref_type == 'tag' && '["rust"]' || (github.event_name == 'push' || github.event_name == 'pull_request') && '["actions"]' || '["actions", "rust"]') }}
        steps:
            - name: "git checkout"
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: "initialize CodeQL"
              uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
              with:
                  languages: ${{ matrix.language }}
                  build-mode: "none"

            - name: "analyze"
              uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
              with:
                  category: "/language:${{ matrix.language }}"
